name: Native validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require supported Python
        run: python3 -c "import sys; assert sys.version_info >= (3, 10), sys.version"
      - name: Verify release inventory and hashes
        run: python3 scripts/verify_manifest.py
      - name: Run native regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate public reference catalogue
        run: python3 scripts/validate_library.py
      - name: Validate worked example catalogue
        run: python3 scripts/validate_library.py --catalogue examples/catalogue.json
